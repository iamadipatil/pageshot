<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Autumn field notes · PageShot</title>
    <link rel="stylesheet" href="../preview.css" />
    <link rel="icon" href="../icons/icon32.png" />
  </head>
  <body>
    <div class="stage">
      <header class="top">
        <div class="brand">
          <img class="mark" src="../icons/icon32.png" alt="" width="28" height="28" />
          <span>PageShot</span>
        </div>
        <p class="aside">Stays on this device</p>
      </header>

      <main class="main">
        <section class="shot">
          <div class="frame">
            <div
              style="
                min-height: 1400px;
                background:
                  linear-gradient(#f3efe6 0 550px, #ead7c4 550px 1100px, #d7e8df 1100px 1400px);
                color: #161513;
                font: 600 28px/1.3 ui-sans-serif, system-ui, sans-serif;
                padding: 48px 40px;
              "
            >
              <p style="margin: 0 0 12px">Section 1</p>
              <p style="margin: 0; font-size: 16px; font-weight: 400; color: #6d6a63">
                Local full-page preview — nothing uploaded.
              </p>
              <p style="margin: 520px 0 12px">Section 2</p>
              <p style="margin: 0; font-size: 16px; font-weight: 400; color: #6d6a63">
                Sticky chrome is captured once, then hidden.
              </p>
            </div>
          </div>
        </section>
      </main>

      <footer class="dock">
        <div class="meta">
          <p class="title">Autumn field notes</p>
          <p class="sub">notes.example.com  ·  900 × 2200</p>
        </div>
        <div class="actions">
          <button type="button" class="ghost">Copy</button>
          <button type="button" class="primary">Download PNG</button>
        </div>
      </footer>
    </div>
  </body>
</html>
